<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <meta name="theme-color" content="#0a0e1a">
  <title>AI創意視頻集 · 盛世前程</title>
  <meta name="description" content="盛世前程 AI創意視頻作品集 — 涵蓋現場記錄、AI視頻、創意短片、AI短劇等多種類型">
  <link rel="stylesheet" href="css/style.css?v=i18n2">
</head>
<body>

  <!-- 科技网格背景 -->
  <div class="grid-bg"></div>
  <div class="scan-line"></div>

  <!-- 顶部导航 -->
  <header class="topbar" id="topbar">
    <div class="topbar-inner">
      <div class="brand" onclick="scrollToTop()">
        <div class="brand-dot"></div>
        <span class="brand-text">HEYDAY <span class="brand-sub">VIDEO</span></span>
      </div>
      <div class="topbar-search">
        <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
        </svg>
        <input type="text" id="searchInput" placeholder="搜尋視頻..." autocomplete="off">
      </div>
    </div>
  </header>

  <!-- Hero 区域 -->
  <section class="hero" id="hero">
    <div class="hero-bg-glow"></div>
    <div class="hero-content">
      <div class="hero-badge">
        <span class="pulse-dot"></span>
        AI CREATIVE VIDEO COLLECTION
      </div>
      <h1 class="hero-title">
        <span class="title-line-1">AI 創意視頻集</span>
        <span class="title-line-2">Creative · Visual · Future</span>
      </h1>
      <p class="hero-desc">以 AI 技術驅動傳播創新 · 覆蓋預熱宣傳 · 現場宣傳 · 產品宣傳全週期內容矩陣</p>
      <div class="hero-stats">
        <div class="stat"><span class="stat-num" data-count="15">0</span><span class="stat-label">精選視頻</span></div>
        <div class="stat"><span class="stat-num" data-count="5">0</span><span class="stat-label">內容分類</span></div>
        <div class="stat"><span class="stat-num" data-count="100">0</span><span class="stat-label">% 原創</span></div>
      </div>
    </div>
  </section>

  <!-- 分类筛选 -->
  <div class="filter-bar" id="filterBar">
    <div class="filter-chips" id="filterChips">
      <!-- JS 动态生成 -->
    </div>
  </div>

  <!-- 视频网格 -->
  <main class="video-grid" id="videoGrid">
    <!-- JS 动态生成 -->
  </main>

  <!-- 空状态 -->
  <div class="empty-state" id="emptyState" style="display:none;">
    <div class="empty-icon">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
      </svg>
    </div>
    <p>沒有找到符合的視頻</p>
  </div>

  <!-- Toast 提示 -->
  <div class="toast" id="toast"></div>

  <!-- 视频播放弹窗 -->
  <div class="player-overlay" id="playerOverlay">
    <div class="player-backdrop" id="playerBackdrop"></div>
    <div class="player-modal" id="playerModal">
      <button class="player-close" id="playerClose" aria-label="關閉">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M18 6 6 18M6 6l12 12"/>
        </svg>
      </button>
      <div class="player-wrapper">
        <video id="playerVideo" controls playsinline preload="metadata"
               controlsList="nodownload noremoteplayback"
               disablepictureinpicture
               disableRemotePlayback
               oncontextmenu="return false"
               draggable="false"></video>
      </div>
      <div class="player-info">
        <div class="player-info-head">
          <div class="player-tag" id="playerTag"></div>
          <button class="share-btn" id="playerShareBtn" aria-label="轉發">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/>
              <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/>
            </svg>
            <span id="shareBtnLabel">轉發</span>
          </button>
        </div>
        <h2 class="player-title" id="playerTitle"></h2>
        <p class="player-desc" id="playerDesc"></p>
      </div>
    </div>
  </div>

  <!-- 悬浮语言切换窗 -->
  <div class="lang-switcher" id="langSwitcher">
    <button class="lang-fab" id="langFab" aria-label="切換語言" title="切換語言">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/>
        <path d="M2 12h20"/>
        <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
      </svg>
      <span class="lang-fab-label" id="langFabLabel">中</span>
    </button>
    <div class="lang-panel" id="langPanel">
      <div class="lang-panel-title" id="langPanelTitle">語言 / Language</div>
      <button class="lang-option" data-lang="zh-Hant">
        <span class="lang-option-name">繁體中文</span>
        <svg class="lang-check" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
      </button>
      <button class="lang-option" data-lang="en">
        <span class="lang-option-name">English</span>
        <svg class="lang-check" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
      </button>
      <button class="lang-option" data-lang="uz">
        <span class="lang-option-name">O‘zbekcha</span>
        <svg class="lang-check" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
      </button>
    </div>
  </div>

  <!-- 页脚 -->
  <footer class="site-footer">
    <div class="footer-glow"></div>
    <div class="footer-inner">
      <div class="footer-brand">
        <div class="brand" style="margin-bottom:12px;">
          <div class="brand-dot"></div>
          <span class="brand-text">HEYDAY <span class="brand-sub">VIDEO</span></span>
        </div>
        <p id="footerCompany">北京盛世前程營銷活動策劃有限公司</p>
      </div>
    </div>
    <div class="footer-bottom">
      <p>&copy; 2024 HEYDAY GROUP. All rights reserved.</p>
    </div>
  </footer>

  <script src="js/videos-data.js"></script>
  <script src="js/i18n.js?v=i18n2"></script>
  <script src="js/app.js?v=i18n2"></script>
</body>
</html>
